name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/export_api.py --check
      - run: uv build
      - run: shellcheck install.sh
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/requirements.txt" >/dev/null
          uvx --python 3.12 pip-audit --disable-pip --no-deps --requirement "$RUNNER_TEMP/requirements.txt"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: git diff --exit-code -- ../src/quantbot/web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --tag ghcr.io/yaho7/quantbot:latest .
      - name: Verify the recommended Compose setup
        run: |
          trap 'docker compose down' EXIT
          test ! -e data
          docker compose up -d --pull never --wait --wait-timeout 60
          curl --fail --silent --show-error http://localhost:8888/healthz
          setup=http://localhost:8888/api/admin/setup
          curl --fail --silent --show-error "$setup" | jq -e '.required and .available'
          curl --fail --silent --show-error "$setup" \
            -H 'Host: quantbot.example.com' -H 'X-Forwarded-Proto: https' \
            -H 'X-Forwarded-For: 203.0.113.10' | jq -e '.required and .available'
          curl --fail --silent --show-error "$setup" \
            -H 'Host: quantbot.example.com' -H 'X-Forwarded-Proto: https' \
            -H 'X-Forwarded-For: 203.0.113.10' -H 'Origin: https://quantbot.example.com' \
            -H 'Content-Type: application/json' \
            --data '{"username":"compose-admin","password":"compose-smoke-test"}' \
            | jq -e '.authenticated'
          test "$(docker compose exec -T quantbot awk '/^Uid:/ {print $2}' /proc/1/status)" = 10001
          docker compose down
          sudo chown root:root data data/quantbot.sqlite3 data/quantbot.lock
          sudo chmod 0755 data
          docker compose up -d --pull never --wait --wait-timeout 60
          curl --fail --silent --show-error "$setup" | jq -e '.required == false'
          docker compose down
          sudo mv data/quantbot.sqlite3 data/quantbot-v2.sqlite3
          sudo chown root:root data/quantbot-v2.sqlite3
          docker compose up -d --pull never --wait --wait-timeout 60
          curl --fail --silent --show-error "$setup" | jq -e '.required == false'
          curl --fail --silent --show-error http://localhost:8888/api/admin/login \
            -H 'Origin: http://localhost:8888' -H 'Content-Type: application/json' \
            --data '{"username":"compose-admin","password":"compose-smoke-test"}' \
            | jq -e '.authenticated'
          sudo test ! -e data/quantbot.sqlite3

  publish-image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, web, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          PY
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/yaho7/quantbot:${{ github.ref_name }}
            ghcr.io/yaho7/quantbot:latest
