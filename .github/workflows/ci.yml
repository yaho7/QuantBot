name: CI

on:
  push:
    branches: [main]
    tags: ["v3.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: shellcheck install.sh deploy/smoke.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      - run: git diff --exit-code -- web/dist
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web

  image:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --tag quantbot:ci .
      - run: deploy/smoke.sh quantbot:ci
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(docker run --rm quantbot:ci version)" = "${TAG#v}"
          mkdir artifacts
          container="$(docker create quantbot:ci)"
          trap 'docker rm "$container"' EXIT
          docker cp "$container:/usr/local/bin/quantbot" "artifacts/quantbot-linux-$ARCH"
          cd artifacts
          sha256sum "quantbot-linux-$ARCH" > "quantbot-linux-$ARCH.sha256"
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: quantbot-linux-${{ matrix.arch }}
          path: artifacts/

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [test, web, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/yaho7/quantbot:${{ github.ref_name }}
            ghcr.io/yaho7/quantbot:latest
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip -q artifacts/quantbot-licenses.zip LICENSE docs/licenses/*
          cp web/dist/lyra-theme.zip artifacts/lyra-theme.zip
          (
            cd artifacts
            sha256sum lyra-theme.zip > lyra-theme.zip.sha256
          )
          notes=()
          if [[ -f "docs/releases/$TAG.md" ]]; then
            notes=(--notes-file "docs/releases/$TAG.md")
          fi
          gh release create "$TAG" artifacts/* --title "QuantBot ${TAG#v}" --verify-tag --generate-notes "${notes[@]}"
