name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: shellcheck install.sh
      - name: Build both packages
        run: uv build . && uv build client

  web:
    # The page is built into src/quantbot/web so installs need no Node; check it is current.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Built page matches the source
        run: git diff --exit-code -- ../src/quantbot/web || (echo "Run npm run build in web/ and commit src/quantbot/web" && exit 1)

  install:
    # The one-line installer on a clean Ubuntu, without the interactive setup.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash install.sh --non-interactive --no-service < /dev/null
        env:
          QUANTBOT_REPO: ${{ github.server_url }}/${{ github.repository }}
          QUANTBOT_REF: ${{ github.sha }}
      - run: ~/.local/bin/quantbot --version && ~/.local/bin/quantbot list
