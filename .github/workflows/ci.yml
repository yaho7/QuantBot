name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - name: Verify the workspace terminal drops Linux root privileges
        run: sudo "$PWD/.venv/bin/python" -m pytest -p no:cacheprovider tests/test_workspace_linux.py
      - run: shellcheck install.sh
      - name: Build both packages
        run: uv build . && uv build client

  web:
    # The page is built into src/quantbot/web so installs need no Node; check it is current.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Built page matches the source
        run: git diff --exit-code -- ../src/quantbot/web || (echo "Run npm run build in web/ and commit src/quantbot/web" && exit 1)

  install:
    # The one-line installer on a clean Ubuntu, without the interactive setup.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a tag from an isolated Git repository
        run: |
          repo="$RUNNER_TEMP/quantbot-install.git"
          git init --bare --quiet "$repo"
          git push --quiet "$repo" HEAD:refs/tags/v0.0.0
          QUANTBOT_REPO="file://$repo" bash install.sh --non-interactive --no-service < /dev/null
        env:
          SHELL: /bin/bash
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/quantbot-bin
      - name: Find QuantBot in a new login shell
        run: bash -lc 'test "$(command -v quantbot)" = "$RUNNER_TEMP/quantbot-bin/quantbot" && quantbot --version | grep -F "v0.0.0" && quantbot list'
