name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: shellcheck install.sh
      - name: Build both packages
        run: uv build . && uv build client

  install:
    # The one-line installer on a clean Ubuntu, without the interactive setup.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash install.sh < /dev/null
        env:
          QUANTBOT_REPO: ${{ github.server_url }}/${{ github.repository }}
          QUANTBOT_REF: ${{ github.sha }}
      - run: ~/.local/bin/quantbot --version && ~/.local/bin/quantbot list
