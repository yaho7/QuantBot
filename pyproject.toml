[project]
name = "quantbot"
version = "2.0.0"
description = "HTTP monitoring and remote controls for independently operated trading programs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pillow>=11,<13",
    "python-telegram-bot>=22,<23",
    "tzdata>=2026.6",
    "uvicorn>=0.34,<1",
]

[project.scripts]
quantbot = "quantbot.__main__:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantbot"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
