[project]
name = "quantbot"
version = "0.1.0"
description = "One Telegram bot to control all your trading programs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.10,<4",
    "python-telegram-bot>=22,<23",
    "tzdata>=2026.6",
    "watchfiles>=1,<2",
]

[project.scripts]
quantbot = "quantbot.__main__:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantbot"]

[tool.hatch.build.targets.wheel.force-include]
"client/quantbot_client.py" = "quantbot/client_template.py"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]
src = ["src", "client"]  # keep hand-aligned comments in the docs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
