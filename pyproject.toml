[project]
name = "tgctl"
version = "0.1.0"
description = "Telegram control for any Python trading program: status, buttons and alerts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["python-telegram-bot>=22,<23"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgctl"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]  # keep hand-aligned comments in the docs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
